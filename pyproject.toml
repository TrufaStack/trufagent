[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trufagent"
version = "0.4.0.dev0"
description = "Context-aware effort orchestration for AI development agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "TrufaStack" }]
dependencies = [
  "graphifyy[mcp]>=0.9.30,<0.10",
  "pydantic>=2.12,<3",
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<0.16",
]

[project.scripts]
trufagent = "trufagent.cli:main"
trufagent-experimental = "trufagent.experimental.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trufagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
